name: pakeeza_pos
description: Offline POS for Pakeeza Fast Food & Pizza Point (Windows desktop).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.3.4+4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/products/
    - assets/images/categories/
